
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore our fictional guide to Iowa City coffee shops, including local favorites, coffee near the University of Iowa, and study-friendly spots.">
  <title>Bean There Iowa City | Coffee Shop Guide</title>

  <style>
    :root {
      --coffee: #4b3028;
      --cream: #fffaf2;
      --tan: #ead9c3;
      --rust: #a65d3f;
      --ink: #29231f;
      --muted: #685d54;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.65;
    }

    a {
      color: inherit;
    }

    .notice {
      background: #f0e6d8;
      color: #49352b;
      text-align: center;
      padding: 12px 18px;
      font-size: .84rem;
    }

    header {
      background: var(--coffee);
      color: white;
    }

    .header-inner,
    main,
    .footer-inner {
      width: min(1080px, 90%);
      margin: auto;
    }

    .header-inner {
      padding: 20px 0 0;
    }

    .logo-link {
      display: inline-block;
      text-decoration: none;
    }

    .site-logo {
      display: block;
      width: 135px;
      max-width: 45vw;
      height: auto;
      margin-bottom: 8px;
    }

    .tagline {
      margin: 4px 0 20px;
      color: #f0dfcd;
    }

    nav {

      flex-wrap: wrap;
      gap: 8px;
      padding: 0 0 18px;
    }

    nav a {

      text-decoration: none;
      padding: 9px 13px;
      border-radius: 6px;
      font-size: .93rem;
    }

    nav a:hover,
    nav a:focus,
    nav a[aria-current="page"] {
      background: #765044;
      outline-offset: 3px;
    }

    main {
      padding: 42px 0 56px;
    }

    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.2;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      margin: 10px 0 16px;
    }

    h2 {
      font-size: clamp(1.55rem, 4vw, 2.15rem);
    }

    h3 {
      font-size: 1.35rem;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      font-size: .78rem;
      color: var(--rust);
    }

    .hero {
      background: var(--tan);
      border-radius: 14px;
      padding: clamp(25px, 6vw, 52px);
      margin-bottom: 32px;
    }

    .hero p {
      max-width: 760px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      display: inline-block;
      background: var(--coffee);
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: .93rem;
    }

    .button:hover,
    .button:focus {
      background: #765044;
    }

    .section-heading {
      margin: 36px 0 20px;
    }

    .section-heading h2 {
      margin-bottom: 8px;
    }

    .section-heading p {
      max-width: 760px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .category-card {
      background: white;
      border: 1px solid #e7dbcd;
      border-radius: 12px;
      padding: clamp(20px, 4vw, 28px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .category-icon {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .category-card h3 {
      margin: 6px 0 10px;
    }

    .category-card p {
      margin-top: 0;
    }

    .text-link {
      color: #87472f;
      font-weight: bold;
      margin-top: auto;
    }

    .guide {
      background: #f3e7d9;
      border-radius: 10px;
      padding: clamp(20px, 4vw, 30px);
      margin-top: 32px;
    }

    .guide h2 {
      margin-top: 0;
    }
